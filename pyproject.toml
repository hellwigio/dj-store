[project]
name = "django-starter"
version = "0.1.0"
description = "Reusable Django production starter"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "django>=5.2.8,<5.3",
  "django-environ>=0.12,<1",
  "gunicorn>=23,<26",
  "psycopg[binary]>=3.2,<4",
  "whitenoise[brotli]>=6.9,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.11,<5", "ruff>=0.12,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
"**/migrations/*.py" = ["E501"]
